<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245c49">
  <meta name="description" content="芳香族化合物の反応問題。構造式の手書きと化合物名の練習ができます。">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=3">
  <title>ベンゼンノート</title>
</head>
<body>
  <header class="app-header">
    <h1>ベンゼンノート</h1>
    <div class="header-actions">
      <button class="text-button" id="libraryOpen" type="button" aria-haspopup="dialog">反応一覧</button>
      <button class="text-button" id="aboutOpen" type="button" aria-haspopup="dialog">設定</button>
    </div>
  </header>

  <main class="workspace">
    <div class="study-controls" role="group" aria-label="出題設定">
      <select id="categorySelect" aria-label="出題範囲"></select>
      <div class="session-tools">
        <button class="text-button" id="shuffleButton" type="button" aria-label="問題をシャッフルして最初から解く">シャッフル</button>
        <button class="text-button" id="reviewButton" type="button">復習 <span id="reviewCount" hidden></span></button>
      </div>
    </div>

    <section class="notebook" id="notebook" aria-label="問題ノート">
      <div id="questionView">
        <header class="question-header">
          <div class="question-row">
            <h2><strong id="reactantName"></strong><span id="questionAction"></span></h2>
            <p class="question-position"><span id="reviewMode" hidden>復習中</span><span id="pageNumber">1 / 49</span></p>
          </div>
          <p class="conditions"><span>条件</span><span id="conditions"></span></p>
        </header>
        <div class="drawing-heading">
          <h3>生成物の構造式</h3>
          <button class="text-button ring-button" id="insertRing" type="button">ベンゼン環を置く</button>
        </div>
        <div class="drawing-toolbar" role="group" aria-label="描画ツール">
          <button class="tool-button active" id="penTool" aria-pressed="true" type="button">ペン</button>
          <button class="tool-button" id="eraserTool" aria-pressed="false" type="button">消しゴム</button>
          <span class="toolbar-spacer"></span>
          <button class="tool-button" id="undoButton" aria-label="ひとつ戻す" type="button">戻す</button>
          <button class="tool-button" id="clearButton" type="button">全消去</button>
        </div>
        <div class="writing-layout" id="writingLayout">
          <div class="drawing-paper" id="drawingPaper">
            <canvas id="drawingCanvas" aria-label="構造式の手書き欄">構造式の手書き欄</canvas>
          </div>
          <section class="structure-answer" id="structureAnswer" hidden aria-label="正解の構造式">
            <h3 class="answer-heading">お手本の構造式</h3>
            <div id="answerMolecule"></div>
          </section>
        </div>
        <div class="name-section">
          <label id="nameLabel" for="nameInput">化合物の名前</label>
          <div class="name-input-wrap" id="nameEntry">
            <input id="nameInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button id="checkButton" type="button">答え合わせ</button>
          </div>
          <output id="nameAnswer" aria-labelledby="nameLabel" tabindex="-1" hidden></output>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
        <section id="explanation" class="explanation" hidden aria-label="答えの解説">
          <h3 class="answer-heading">構造式になる理由</h3>
          <p id="explanationText"></p>
          <h3 class="answer-heading">名前の由来・覚え方</h3>
          <p id="nameOriginText"></p>
        </section>
        <div class="notebook-actions">
          <button id="skipButton" class="text-button skip-button" type="button">スキップ<span id="skipHint">構造式を見る</span></button>
          <button id="nextButton" class="primary-button" type="button">次の問題へ</button>
        </div>
      </div>
      <section id="completeView" class="complete-view" hidden>
        <h2>学習終了</h2>
        <p id="completionSummary"></p>
        <button id="restartButton" class="primary-button" type="button">最初から</button>
        <button id="completeReviewButton" class="text-button" type="button">復習する</button>
      </section>
    </section>
  </main>

  <dialog id="libraryDialog" aria-labelledby="libraryTitle">
    <div class="dialog-header">
      <h2 id="libraryTitle">反応一覧</h2>
      <button class="text-button" id="libraryClose" type="button" aria-label="反応一覧を閉じる">閉じる</button>
    </div>
    <div id="libraryList"></div>
  </dialog>
  <dialog id="aboutDialog" class="settings" aria-labelledby="aboutTitle">
    <div class="dialog-header">
      <h2 id="aboutTitle">設定</h2>
      <button class="text-button" id="aboutClose" type="button" aria-label="設定を閉じる">閉じる</button>
    </div>
    <p>学習記録と手書きはこのブラウザに保存されます。</p>
    <button id="resetProgressButton" class="danger-button" type="button">学習記録をリセット</button>
    <p class="reset-message" id="resetMessage" role="status"></p>
    <p class="credits">参考資料「THE・ベンゼン」</p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./app.js?v=2"></script>
</body>
</html>
